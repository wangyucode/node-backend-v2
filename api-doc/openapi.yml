openapi: 3.0.0
info:
  title: WYCODE API Docs - OpenAPI 3.0
  description: |
    This is wycode.cn 's API doc based on the OpenAPI 3.0 specification.  You can find out more at [github](https://github.com/wangyucode/deno-backend).
  contact:
    email: wangyu@wycode.cn
  version: 2024.09.25
servers:
  - url: http://localhost:8083/api/v1
  - url: https://wycode.cn/api/v1
tags:
  - name: basic
  - name: comment
  - name: config
  - name: clipboard
paths:
  /:
    get:
      tags:
        - basic
      summary: get state
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /email:
    post:
      tags:
        - basic
      summary: send email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /comment:
    get:
      tags:
        - comment
      summary: get all comments
      parameters:
        - name: a
          in: query
          description: app
          required: true
          schema:
            type: string
        - name: k
          in: query
          description: key
          required: true
          schema:
            type: string
        - name: t
          in: query
          description: topic
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
    
    post:
      tags:
        - comment
      summary: add a comment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /config:
    get:
      tags:
        - config
      summary: get a config
      parameters:
        - name: key
          in: query
          description: config key
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /wechat/apps:
    get:
      tags:
        - basic
      summary: get wechat apps
      parameters:
        - name: Referer
          in: header
          description: referer
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /clipboard/wx/{code}:
    get:
      tags:
        - clipboard
      summary: get clipboard by wechat auth code
      parameters:
        - name: code
          in: path
          description: wx auth code
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /clipboard/notification:
    get:
      tags:
        - clipboard
      summary: get clipboard notification
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /clipboard/{id}:
    get:
      tags:
        - clipboard
      summary: get clipboard by id
      parameters:
        - name: id
          in: path
          description: clipboard id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /clipboard/openid/{openid}:
    get:
      tags:
        - clipboard
      summary: get clipboard by openid
      parameters:
        - name: openid
          in: path
          description: openid
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

  /clipboard:
    post:
      tags:
        - clipboard
      summary: change content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Clipboard'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
  
  /coze/token:
    get:
      tags:
        - basic
      summary: get coze access token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
  
  /blog-view:
    get:
      tags:
        - basic
      summary: record blog view count
      parameters:
        - name: id
          in: query
          description: post id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
  
  /popular-posts:
    get:
      tags:
        - basic
      summary: get popular blog posts
      parameters:
        - name: days
          in: query
          description: days range (default: 30)
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: result limit (default: 10, max: 50)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResult'

components:
  
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header       # can be "header", "query" or "cookie"
      name: X-API-Key
  
  schemas:
    State:
      type: object
      properties:
        state:
          type: string
          description: state
          default: ok
        time:
          type: number
          description: timestamp
    
    CommonResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        payload:
          type: object
    
    Comment:
      type: object
      properties:
        type:
          type: number
        content:
          type: string
        app:
          type: string
        key:
          type: string
        topic:
          type: string
        user:
          type: string
        to:
          type: object
        toId:
          type: string
    
    Clipboard:
      type: object
      properties:
        _id:
          type: string
        content:
          type: string

    Email:
      type: object
      properties:
        key:
          type: string
        to:
          type: string
        subject:
          type: string
        content:
          type: string
    
    BlogView:
      type: object
      properties:
        postId:
          type: string
        viewCount:
          type: integer
        lastViewTime:
          type: string
          format: date-time
    
    PopularPostsResponse:
      type: object
      properties:
        days:
          type: integer
        limit:
          type: integer
        posts:
          type: array
          items:
            $ref: '#/components/schemas/BlogView'
