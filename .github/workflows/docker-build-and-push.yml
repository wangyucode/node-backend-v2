name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: wangyucode
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read package.json version
        id: read-version
        run: |
          echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            wangyucode/node-backend:latest
            wangyucode/node-backend:${{ steps.read-version.outputs.VERSION }}

      - name: Call watchtower to check image
        run: |
          curl -m 600 -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" wycode.cn:8086/v1/update

      - name: upload api docs
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: "wycode.cn"
          privateKey: ${{ secrets.SERVER_KEY }}
          localDir: "api-doc"
          dryRun: false
          compress: true
          remoteDir: "/root/data/www/swagger-ui/"
